# ============================================
#   GARI BOT - Configuração do Railway
# ============================================

[build]
# Railway detecta Node.js automaticamente pelo package.json
# Railpack cuida do npm install sozinho

[deploy]
# Comando para iniciar o bot
startCommand = "node src/index.js"

# Política de reinício automático em caso de falha
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
